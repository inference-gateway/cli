version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocyclo
    - cyclop
    - funlen
    - gocognit
    - nestif
    - loggercheck
    - depguard
  disable:
    - exhaustruct
    - varnamelen
    - wrapcheck
    - paralleltest
    - testpackage
  settings:
    depguard:
      rules:
        presentation-is-a-leaf:
          list-mode: lax
          files:
            - "**/internal/**"
            - "!**/internal/presentation/**"
            - "!**/internal/container/**"
            - "!$test"
          deny:
            - pkg: github.com/inference-gateway/cli/internal/presentation
              desc: "domain, capability and platform contexts must not depend on a UI surface; internal/container is the composition root and is exempt"
            - pkg: charm.land/bubbletea
              desc: "bubbletea belongs to internal/presentation, cmd and internal/container only"
        domain-is-pure:
          list-mode: lax
          files:
            - "**/internal/*/domain/**"
            - "!$test"
          allow:
            - github.com/inference-gateway/cli/internal/agent/domain
          deny:
            - pkg: github.com/inference-gateway/cli/internal
              desc: "a domain/ package imports only stdlib, external types and the agent/domain shared kernel"
        tools-do-not-import-the-agent:
          list-mode: lax
          files:
            - "**/internal/tools/**"
            - "!$test"
          allow:
            - github.com/inference-gateway/cli/internal/agent/domain
          deny:
            - pkg: github.com/inference-gateway/cli/internal/agent
              desc: "the agent context consumes the tools context, never the other way round; agent/domain stays the shared kernel"
        container-is-the-root:
          list-mode: lax
          files:
            - "**/internal/**"
            - "!**/internal/container/**"
            - "!$test"
          deny:
            - pkg: github.com/inference-gateway/cli/internal/container
              desc: "internal/container is the composition root; cmd/ builds it and passes ports in"
        telegram-only-in-presentation:
          list-mode: lax
          files:
            - "**"
            - "!**/internal/presentation/telegram/**"
          deny:
            - pkg: github.com/go-telegram/bot
              desc: "the Telegram driver lives in internal/presentation/telegram; consume internal/channels instead"
        adk-only-in-a2a:
          list-mode: lax
          files:
            - "**"
            - "!**/internal/protocols/a2a/**"
            - "!**/tests/mocks/adk/**"
          deny:
            - pkg: github.com/inference-gateway/adk
              desc: "the A2A ADK is confined to the a2a context; consume internal/protocols/a2a/domain instead"
        agui-only-in-agui:
          list-mode: lax
          files:
            - "**"
            - "!**/internal/protocols/agui/**"
          deny:
            - pkg: github.com/ag-ui-protocol/ag-ui
              desc: "the AG-UI SDK is confined to the agui context"
        playwright-only-in-browser:
          list-mode: lax
          files:
            - "**"
            - "!**/internal/browser/**"
          deny:
            - pkg: github.com/mxschmitt/playwright-go
              desc: "Playwright is confined to the browser capability"
        robotgo-only-in-computer:
          list-mode: lax
          files:
            - "**"
            - "!**/internal/computer/**"
          deny:
            - pkg: github.com/go-vgo/robotgo
              desc: "robotgo is confined to the computer capability"
        websocket-only-in-agui-and-web:
          list-mode: lax
          files:
            - "**"
            - "!**/internal/protocols/agui/**"
            - "!**/internal/presentation/**"
          deny:
            - pkg: github.com/gorilla/websocket
              desc: "the binding's socket lives in protocols/agui and the web terminal in presentation; open sockets nowhere else"
        agui-imports-are-closed:
          list-mode: strict
          files:
            - "**/internal/protocols/agui/**"
          allow:
            - $gostd
            - github.com/ag-ui-protocol/ag-ui/sdks/community/go/pkg/core/events
            - github.com/ag-ui-protocol/ag-ui/sdks/community/go/pkg/core/types
            - github.com/google/uuid
            - github.com/gorilla/websocket
            - github.com/inference-gateway/cli/internal/platform/logger
            - github.com/inference-gateway/cli/internal/protocols/agui
            - github.com/inference-gateway/cli/tests/mocks/agui
            - github.com/santhosh-tekuri/jsonschema/v6
          deny:
            - pkg: github.com/inference-gateway/cli/internal
              desc: "agui is a general-purpose protocol package; the contexts import it and it imports none of them"
            - pkg: github.com/inference-gateway/cli/config
              desc: "agui takes its settings as plain values; the caller reads the config"
    gocyclo:
      min-complexity: 25
    cyclop:
      max-complexity: 25
      package-average: 15.0
    funlen:
      lines: 150
      statements: 80
    gocognit:
      min-complexity: 45
    nestif:
      min-complexity: 4
    loggercheck:
      no-printf-like: true
      rules:
        - github.com/inference-gateway/cli/internal/platform/logger.Debug
        - github.com/inference-gateway/cli/internal/platform/logger.Info
        - github.com/inference-gateway/cli/internal/platform/logger.Warn
        - github.com/inference-gateway/cli/internal/platform/logger.Error
        - github.com/inference-gateway/cli/internal/platform/logger.WarnCtx
        - github.com/inference-gateway/cli/internal/platform/logger.ErrorCtx
  exclusions:
    rules:
      - linters:
          - staticcheck
        text: "SA5011"
        path: _test\.go

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gci
  settings:
    gci:
      custom-order: true
      sections:
        - standard
        - prefix(github.com/stretchr/testify)
        - prefix(github.com/inference-gateway/cli/tests/mocks)
        - default
        - prefix(github.com/inference-gateway/)
        - prefix(github.com/inference-gateway/cli)
