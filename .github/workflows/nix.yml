---
name: Nix

on:
  push:
    branches:
      - main
    paths:
      - flake.nix
      - flake.lock
      - go.mod
      - go.sum
      - .github/workflows/nix.yml
  pull_request:
    branches:
      - main
    paths:
      - flake.nix
      - flake.lock
      - go.mod
      - go.sum
      - .github/workflows/nix.yml

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Validate flake builds
        run: |
          sed -i.bak 's|vendorHash = "[^"]*";|vendorHash = "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=";|' flake.nix && rm flake.nix.bak
          NEW_HASH=""
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3 to compute vendorHash"
            NEW_HASH=$(nix build .#infer 2>&1 | tee /dev/stderr | awk '/got:/ {print $2; exit}')
            if [ -n "$NEW_HASH" ]; then
              break
            fi
            echo "Attempt $attempt failed before the vendor hash check, likely a transient go module fetch error, retrying"
            sleep 10
          done
          if [ -z "$NEW_HASH" ]; then
            echo "ERROR: could not extract vendorHash from nix build output"
            exit 1
          fi
          sed -i.bak "s|vendorHash = \"sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\";|vendorHash = \"$NEW_HASH\";|" flake.nix && rm flake.nix.bak
          echo "Computed vendorHash: $NEW_HASH"
          FINAL_OK=""
          for attempt in 1 2 3; do
            echo "Final nix build attempt $attempt of 3"
            if nix build .#infer; then
              FINAL_OK="1"
              break
            fi
            echo "Attempt $attempt failed, likely a transient go module fetch error, retrying"
            sleep 10
          done
          if [ -z "$FINAL_OK" ]; then
            echo "ERROR: nix build failed after 3 attempts"
            exit 1
          fi
          ./result/bin/infer version
