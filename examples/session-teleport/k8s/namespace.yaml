apiVersion: v1
kind: Namespace
metadata:
  name: infer-workspaces
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infer-workspace
  namespace: infer-workspaces
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infer-workspace-self-suspend
  namespace: infer-workspaces
rules:
  - apiGroups:
      - agents.x-k8s.io
    resources:
      - sandboxes
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infer-workspace-self-suspend
  namespace: infer-workspaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: infer-workspace-self-suspend
subjects:
  - kind: ServiceAccount
    name: infer-workspace
    namespace: infer-workspaces
