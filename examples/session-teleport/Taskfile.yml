version: '3'

vars:
  CLUSTER: infer-workspaces
  NAMESPACE: infer-workspaces
  AGENT_SANDBOX_VERSION: v1.0.8
  OPERATOR_VERSION: v0.28.0
  HOME_DIR: '{{.TASKFILE_DIR}}/.home'
  INFER: '{{default (print .TASKFILE_DIR "/../../infer") .INFER}}'

env:
  INFER_GATEWAY_MOCK: 'true'
  INFER_AGENT_MODEL: mock/openai/gpt-4o

tasks:
  cluster:create:
    desc: Create the k3d cluster with ctlptl, install agent-sandbox, the Inference Gateway operator and the workspace namespace
    cmds:
      - ctlptl apply -f Cluster.yaml
      - kubectl --context k3d-{{.CLUSTER}} apply -f https://github.com/kubernetes-sigs/agent-sandbox/releases/download/{{.AGENT_SANDBOX_VERSION}}/sandbox.yaml
      - kubectl --context k3d-{{.CLUSTER}} -n agent-sandbox-system wait --for=condition=Available deployment --all --timeout=180s
      - task: operator:install
      - kubectl --context k3d-{{.CLUSTER}} apply -f k8s/namespace.yaml

  operator:install:
    desc: Install the Inference Gateway operator, after agent-sandbox so the operator finds it (k3s ships the Gateway API CRDs it needs)
    cmds:
      - kubectl --context k3d-{{.CLUSTER}} apply -f https://github.com/inference-gateway/operator/releases/download/{{.OPERATOR_VERSION}}/install.yaml
      - kubectl --context k3d-{{.CLUSTER}} -n inference-gateway-system wait --for=condition=Available deployment --all --timeout=180s

  image:import:
    desc: Build the infer image from this checkout and import it into the cluster
    cmds:
      - task -d {{.TASKFILE_DIR}}/../.. container:build
      - k3d image import ghcr.io/inference-gateway/cli:local -c {{.CLUSTER}}

  desktop:image:
    desc: Build the desktop image (Xvfb and Chromium on top of INFER_IMAGE, default the image task image:import builds) and import it into the cluster
    cmds:
      - docker build {{if .INFER_IMAGE}}--build-arg INFER_IMAGE={{.INFER_IMAGE}}{{end}} -t infer-desktop:local desktop
      - k3d image import infer-desktop:local -c {{.CLUSTER}}

  desktop:screenshot:
    desc: Save what the k8s-desktop pod's screen shows to .home/desktop.png
    cmds:
      - |
        POD=$(kubectl --context k3d-{{.CLUSTER}} -n {{.NAMESPACE}} get pods -l inference-gateway.com/workspace=k8s-desktop -o jsonpath='{.items[0].metadata.name}')
        kubectl --context k3d-{{.CLUSTER}} -n {{.NAMESPACE}} exec $POD -- \
          ffmpeg -loglevel error -f x11grab -video_size 1280x800 -i :99 -frames:v 1 -f image2 -vcodec png - > {{.HOME_DIR}}/desktop.png
      - echo "saved {{.HOME_DIR}}/desktop.png"

  artifacts:install:
    desc: Deploy RustFS, the S3-compatible store the k8s-desktop pod uploads its artifacts to
    cmds:
      - kubectl --context k3d-{{.CLUSTER}} apply -f k8s/rustfs.yaml
      - kubectl --context k3d-{{.CLUSTER}} -n {{.NAMESPACE}} rollout status deployment/rustfs --timeout=180s

  artifacts:list:
    desc: List the artifacts in RustFS, one prefix per session
    cmds:
      - defer: kubectl --context k3d-{{.CLUSTER}} -n {{.NAMESPACE}} delete pod artifacts-ls --ignore-not-found
      - |
        kubectl --context k3d-{{.CLUSTER}} -n {{.NAMESPACE}} run artifacts-ls --restart=Never \
          --image=infer-desktop:local --image-pull-policy=Never \
          --env MC_HOST_store=http://rustfsadmin:rustfsadmin@rustfs:9000 \
          --command -- mcli ls -r store/infer-artifacts
      - kubectl --context k3d-{{.CLUSTER}} -n {{.NAMESPACE}} wait --for=jsonpath='{.status.containerStatuses[0].state.terminated}' pod/artifacts-ls --timeout=60s
      - kubectl --context k3d-{{.CLUSTER}} -n {{.NAMESPACE}} logs artifacts-ls

  artifacts:console:
    desc: Port-forward the RustFS console to http://localhost:9001/rustfs/console/ (rustfsadmin / rustfsadmin)
    cmds:
      - kubectl --context k3d-{{.CLUSTER}} -n {{.NAMESPACE}} port-forward svc/rustfs 9001:9001

  home:
    desc: Seed the demo HOME with daemon.yaml and a small git project to teleport
    cmds:
      - mkdir -p {{.HOME_DIR}}/.infer {{.HOME_DIR}}/project
      - cp daemon.yaml {{.HOME_DIR}}/.infer/daemon.yaml
      - |
        cd {{.HOME_DIR}}/project
        if [ ! -d .git ]; then
          git init --quiet -b main
          git config user.email demo@example.com
          git config user.name demo
          git config commit.gpgsign false
          echo "# teleport me" > README.md
          git add README.md
          git commit --quiet -m "init"
        fi

  daemon:start:
    desc: Run the laptop daemon with the demo HOME (foreground, keep it in its own shell)
    deps:
      - home
    cmds:
      - HOME={{.HOME_DIR}} KUBECONFIG=$(k3d kubeconfig write {{.CLUSTER}}) {{.INFER}} daemon

  chat:
    desc: Chat in the demo project through the laptop daemon (started when needed), and teleport the session with /workspaces or /teleport
    deps:
      - home
    interactive: true
    cmds:
      - cd {{.HOME_DIR}}/project && HOME={{.HOME_DIR}} KUBECONFIG=$(k3d kubeconfig write {{.CLUSTER}}) {{.INFER}} chat --daemon {{.CLI_ARGS}}

  workspaces:
    desc: List the workspaces and their reachability
    cmds:
      - HOME={{.HOME_DIR}} {{.INFER}} daemon workspaces

  demo:
    desc: Create a conversation, teleport it to the TARGET workspace (default k8s-dev) and continue it there with PROMPT
    vars:
      TARGET: '{{default "k8s-dev" .TARGET}}'
      PROMPT: '{{default "say hello again" .PROMPT}}'
      ID:
        sh: uuidgen | tr 'A-Z' 'a-z'
    cmds:
      - cd {{.HOME_DIR}}/project && HOME={{.HOME_DIR}} {{.INFER}} headless --session-id {{.ID}} "say hello"
      - HOME={{.HOME_DIR}} {{.INFER}} daemon workspaces
      - HOME={{.HOME_DIR}} {{.INFER}} daemon teleport {{.ID}} --to {{.TARGET}} --project-dir {{.HOME_DIR}}/project
      - kubectl --context k3d-{{.CLUSTER}} -n {{.NAMESPACE}} get orchestrators,pods
      - HOME={{.HOME_DIR}} {{.INFER}} daemon run {{.ID}} "{{.PROMPT}}" --project-dir {{.HOME_DIR}}/project
      - echo "conversation {{.ID}} now lives on {{.TARGET}}"

  cleanup:
    desc: Delete the cluster and the demo HOME
    cmds:
      - ctlptl delete -f Cluster.yaml
      - rm -rf {{.HOME_DIR}}
