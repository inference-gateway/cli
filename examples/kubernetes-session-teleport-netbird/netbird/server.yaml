apiVersion: v1
kind: Namespace
metadata:
  name: netbird
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: netbird-data
  namespace: netbird
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird
  namespace: netbird
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: netbird
  template:
    metadata:
      labels:
        app: netbird
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3d-infer-netbird-server-0
      containers:
        - name: netbird-server
          image: netbirdio/netbird-server:0.82.0
          args:
            - --config
            - /etc/netbird/config.yaml
          env:
            - name: NB_SETUP_PAT_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 18080
            - name: stun
              containerPort: 3478
              protocol: UDP
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/netbird
              readOnly: true
            - name: data
              mountPath: /var/lib/netbird
      volumes:
        - name: config
          secret:
            secretName: netbird-config
        - name: data
          persistentVolumeClaim:
            claimName: netbird-data
---
apiVersion: v1
kind: Service
metadata:
  name: netbird
  namespace: netbird
spec:
  type: LoadBalancer
  selector:
    app: netbird
  ports:
    - name: http
      port: 18080
      targetPort: http
    - name: stun
      port: 3478
      targetPort: stun
      protocol: UDP
