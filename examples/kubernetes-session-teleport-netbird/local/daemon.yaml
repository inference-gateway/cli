workspace: infer-local
workspaces:
  - name: infer-local
    kind: local
  - name: infer-k8s
    kind: daemon
    address: infer-k8s.netbird.internal:52789
    token: ${INFER_K8S_TOKEN}
    tls:
      ca_file: /etc/infer/infer-k8s-ca.crt
    forward_env:
      - DEMO_SECRET
binding:
  enabled: true
  port: 52789
