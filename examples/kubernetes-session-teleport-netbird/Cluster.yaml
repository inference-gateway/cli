apiVersion: ctlptl.dev/v1alpha1
kind: Cluster
product: k3d
name: k3d-infer-netbird
k3d:
  v1alpha5Simple:
    agents: 2
    image: docker.io/rancher/k3s:v1.37.1-k3s1
    ports:
      - port: 18080:18080
        nodeFilters:
          - loadbalancer
      - port: 18081:18081
        nodeFilters:
          - loadbalancer
