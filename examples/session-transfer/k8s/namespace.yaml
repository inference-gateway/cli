apiVersion: v1
kind: Namespace
metadata:
  name: infer-environments
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infer-environment
  namespace: infer-environments
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infer-environment-self-suspend
  namespace: infer-environments
rules:
  - apiGroups:
      - agents.x-k8s.io
    resources:
      - sandboxes
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infer-environment-self-suspend
  namespace: infer-environments
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: infer-environment-self-suspend
subjects:
  - kind: ServiceAccount
    name: infer-environment
    namespace: infer-environments
