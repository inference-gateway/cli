version: '3'

vars:
  CLUSTER: infer-environments
  NAMESPACE: infer-environments
  AGENT_SANDBOX_VERSION: v1.0.8
  SPIRE_VERSION: 1.15.5
  HOME_DIR: '{{.TASKFILE_DIR}}/.home'
  SPIRE_SOCKET: /tmp/infer-spire-agent.sock
  INFER: '{{default (print .TASKFILE_DIR "/../../infer") .INFER}}'

env:
  INFER_GATEWAY_MOCK: 'true'
  INFER_AGENT_MODEL: mock/openai/gpt-4o

tasks:
  cluster:create:
    desc: Create the k3d cluster with ctlptl, install agent-sandbox and the environment namespace
    cmds:
      - ctlptl apply -f Cluster.yaml
      - kubectl --context k3d-{{.CLUSTER}} apply -f https://github.com/kubernetes-sigs/agent-sandbox/releases/download/{{.AGENT_SANDBOX_VERSION}}/sandbox.yaml
      - kubectl --context k3d-{{.CLUSTER}} -n agent-sandbox-system wait --for=condition=Available deployment --all --timeout=180s
      - kubectl --context k3d-{{.CLUSTER}} apply -f k8s/namespace.yaml

  image:import:
    desc: Build the infer image from this checkout and import it into the cluster
    cmds:
      - task -d {{.TASKFILE_DIR}}/../.. container:build
      - k3d image import ghcr.io/inference-gateway/cli:local -c {{.CLUSTER}}

  desktop:image:
    desc: Build the desktop image (Xvfb and Chromium on top of INFER_IMAGE, default the release candidate) and import it into the cluster
    cmds:
      - docker build {{if .INFER_IMAGE}}--build-arg INFER_IMAGE={{.INFER_IMAGE}}{{end}} -t infer-desktop:local desktop
      - k3d image import infer-desktop:local -c {{.CLUSTER}}

  desktop:screenshot:
    desc: Save what the k8s-desktop pod's screen shows to .home/desktop.png
    cmds:
      - |
        POD=$(kubectl --context k3d-{{.CLUSTER}} -n {{.NAMESPACE}} get pods -l inference-gateway.com/environment=k8s-desktop -o jsonpath='{.items[0].metadata.name}')
        kubectl --context k3d-{{.CLUSTER}} -n {{.NAMESPACE}} exec $POD -- \
          ffmpeg -loglevel error -f x11grab -video_size 1280x800 -i :99 -frames:v 1 -f image2 -vcodec png - > {{.HOME_DIR}}/desktop.png
      - echo "saved {{.HOME_DIR}}/desktop.png"

  artifacts:install:
    desc: Deploy RustFS, the S3-compatible store the k8s-desktop pod uploads its artifacts to
    cmds:
      - kubectl --context k3d-{{.CLUSTER}} apply -f k8s/rustfs.yaml
      - kubectl --context k3d-{{.CLUSTER}} -n {{.NAMESPACE}} rollout status deployment/rustfs --timeout=180s

  artifacts:list:
    desc: List the artifacts in RustFS, one prefix per session
    cmds:
      - defer: kubectl --context k3d-{{.CLUSTER}} -n {{.NAMESPACE}} delete pod artifacts-ls --ignore-not-found
      - |
        kubectl --context k3d-{{.CLUSTER}} -n {{.NAMESPACE}} run artifacts-ls --restart=Never \
          --image=infer-desktop:local --image-pull-policy=Never \
          --env MC_HOST_store=http://rustfsadmin:rustfsadmin@rustfs:9000 \
          --command -- mcli ls -r store/infer-artifacts
      - kubectl --context k3d-{{.CLUSTER}} -n {{.NAMESPACE}} wait --for=jsonpath='{.status.containerStatuses[0].state.terminated}' pod/artifacts-ls --timeout=60s
      - kubectl --context k3d-{{.CLUSTER}} -n {{.NAMESPACE}} logs artifacts-ls

  artifacts:console:
    desc: Port-forward the RustFS console to http://localhost:9001/rustfs/console/ (rustfsadmin / rustfsadmin)
    cmds:
      - kubectl --context k3d-{{.CLUSTER}} -n {{.NAMESPACE}} port-forward svc/rustfs 9001:9001

  home:
    desc: Seed the demo HOME with daemon.yaml and a small git project to transfer
    cmds:
      - mkdir -p {{.HOME_DIR}}/.infer {{.HOME_DIR}}/project
      - cp daemon.yaml {{.HOME_DIR}}/.infer/daemon.yaml
      - |
        cd {{.HOME_DIR}}/project
        if [ ! -d .git ]; then
          git init --quiet -b main
          git config user.email demo@example.com
          git config user.name demo
          git config commit.gpgsign false
          echo "# transfer me" > README.md
          git add README.md
          git commit --quiet -m "init"
        fi

  daemon:start:
    desc: Run the laptop daemon with the demo HOME (foreground, keep it in its own shell)
    deps:
      - home
    cmds:
      - HOME={{.HOME_DIR}} KUBECONFIG=$(k3d kubeconfig write {{.CLUSTER}}) {{.INFER}} daemon

  daemon:start:spiffe:
    desc: Run the laptop daemon with its SVID from the spire-agent started by spire:agent (foreground)
    deps:
      - home
    cmds:
      - HOME={{.HOME_DIR}} KUBECONFIG=$(k3d kubeconfig write {{.CLUSTER}}) INFER_DAEMON_BINDING_TLS_SPIFFE_SOCKET=unix://{{.SPIRE_SOCKET}} {{.INFER}} daemon

  chat:
    desc: Chat in the demo project through the laptop daemon (started when needed), and move the session with /environments or /transfer
    deps:
      - home
    interactive: true
    cmds:
      - cd {{.HOME_DIR}}/project && HOME={{.HOME_DIR}} KUBECONFIG=$(k3d kubeconfig write {{.CLUSTER}}) {{.INFER}} chat --daemon

  environments:
    desc: List the environments and their reachability
    cmds:
      - HOME={{.HOME_DIR}} {{.INFER}} daemon environments

  demo:
    desc: Create a conversation, move it to the TARGET environment (default k8s-dev) and continue it there with PROMPT
    vars:
      TARGET: '{{default "k8s-dev" .TARGET}}'
      PROMPT: '{{default "say hello again" .PROMPT}}'
      ID:
        sh: uuidgen | tr 'A-Z' 'a-z'
    cmds:
      - cd {{.HOME_DIR}}/project && HOME={{.HOME_DIR}} {{.INFER}} headless --session-id {{.ID}} "say hello"
      - HOME={{.HOME_DIR}} {{.INFER}} daemon environments
      - HOME={{.HOME_DIR}} {{.INFER}} daemon transfer {{.ID}} --to {{.TARGET}} --project-dir {{.HOME_DIR}}/project
      - kubectl --context k3d-{{.CLUSTER}} -n {{.NAMESPACE}} get sandboxes,pods
      - HOME={{.HOME_DIR}} {{.INFER}} daemon run {{.ID}} "{{.PROMPT}}" --project-dir {{.HOME_DIR}}/project
      - echo "conversation {{.ID}} now lives on {{.TARGET}}"

  spire:install:
    desc: Install SPIRE (server, agent, CSI driver) into the cluster
    cmds:
      - helm --kube-context k3d-{{.CLUSTER}} upgrade --install -n spire-mgmt spire-crds spire-crds --repo https://spiffe.github.io/helm-charts-hardened/ --create-namespace
      - helm --kube-context k3d-{{.CLUSTER}} upgrade --install -n spire-mgmt spire spire --repo https://spiffe.github.io/helm-charts-hardened/ -f k8s/spire-values.yaml --wait --timeout 10m

  spire:agent:
    desc: Build spire-agent for this machine, register the laptop daemon and run the agent (foreground)
    cmds:
      - GOBIN={{.HOME_DIR}}/bin go install github.com/spiffe/spire/cmd/spire-agent@v{{.SPIRE_VERSION}}
      - rm -rf {{.HOME_DIR}}/spire && mkdir -p {{.HOME_DIR}}/spire/data
      - |
        set -e
        spire() { kubectl --context k3d-{{.CLUSTER}} -n spire-server exec spire-server-0 -c spire-server -- spire-server "$@"; }
        TOKEN=$(spire token generate -spiffeID spiffe://infer.local/environment/laptop | awk '{print $2}')
        spire entry create -parentID spiffe://infer.local/environment/laptop \
          -spiffeID spiffe://infer.local/environment/laptop/daemon -selector unix:uid:$(id -u) || true
        spire bundle show > {{.HOME_DIR}}/spire/bundle.pem
        sed -e "s|DATA_DIR|{{.HOME_DIR}}/spire/data|g" -e "s|SOCKET_PATH|{{.SPIRE_SOCKET}}|g" \
          -e "s|BUNDLE_PATH|{{.HOME_DIR}}/spire/bundle.pem|g" -e "s|JOIN_TOKEN|$TOKEN|g" spire/agent.conf.tmpl > {{.HOME_DIR}}/spire/agent.conf
        kubectl --context k3d-{{.CLUSTER}} -n spire-server port-forward svc/spire-server 8081:443 &
        trap 'kill %1' EXIT
        sleep 2
        {{.HOME_DIR}}/bin/spire-agent run -config {{.HOME_DIR}}/spire/agent.conf

  cleanup:
    desc: Delete the cluster and the demo HOME
    cmds:
      - ctlptl delete -f Cluster.yaml
      - rm -rf {{.HOME_DIR}}
