environment: laptop
environments:
  - name: laptop
    kind: local
  - name: k8s-dev
    kind: kubernetes
    context: k3d-infer-environments
    namespace: infer-environments
    image: ghcr.io/inference-gateway/cli:0.239.0-rc.3
    storage: 1Gi
    idle_ttl: 30m
    auth: ca
    env:
      INFER_GATEWAY_MOCK: "true"
      INFER_AGENT_MODEL: mock/openai/gpt-4o
  - name: k8s-spiffe
    kind: kubernetes
    context: k3d-infer-environments
    namespace: infer-environments
    image: ghcr.io/inference-gateway/cli:0.239.0-rc.3
    storage: 1Gi
    idle_ttl: 30m
    auth: spiffe
    spiffe:
      trust_domain: infer.local
      server_id: spiffe://infer.local/ns/infer-environments/sa/infer-environment
    env:
      INFER_GATEWAY_MOCK: "true"
      INFER_AGENT_MODEL: mock/openai/gpt-4o
  - name: k8s-desktop
    kind: kubernetes
    context: k3d-infer-environments
    namespace: infer-environments
    image: infer-desktop:local
    storage: 1Gi
    idle_ttl: 30m
    auth: ca
    env:
      INFER_GATEWAY_MOCK: "true"
      INFER_GATEWAY_MOCK_SCENARIOS: /opt/infer-desktop/scenarios.yaml
      INFER_AGENT_MODEL: mock/openai/gpt-4o
      INFER_COMPUTER_USE_ENABLED: "true"
      INFER_COMPUTER_USE_RECORDING_ENABLED: "true"
      INFER_COMPUTER_USE_RECORDING_REQUIRE_APPROVAL: "false"
      INFER_COMPUTER_USE_RECORDING_OUTPUT_DIR: /home/infer/.infer/artifacts
      INFER_TOOLS_BASH_ALLOW_APPEND: upload-artifacts
      ARTIFACTS_ENDPOINT: http://rustfs:9000
      ARTIFACTS_BUCKET: infer-artifacts
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
binding:
  enabled: true
  port: 52789
  token: session-transfer-demo
