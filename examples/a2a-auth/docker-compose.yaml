---
services:
  mock-agent-token:
    image: ghcr.io/inference-gateway/mock-agent:0.5.0
    pull_policy: always
    ports:
      - "8091:8080"
    environment:
      A2A_AGENT_URL: http://localhost:8091
      A2A_AUTH_TOKEN: demo-token
    restart: unless-stopped
    networks:
      - a2a-auth-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8090
      KC_HOSTNAME: http://localhost:8090
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8090:8090"
      - "8092:8080"
    restart: unless-stopped
    networks:
      - a2a-auth-network

  keycloak-ready:
    image: curlimages/curl:latest
    depends_on:
      - keycloak
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        until curl -sf http://keycloak:8090/realms/a2a/.well-known/openid-configuration > /dev/null; do
          echo 'Waiting for the Keycloak realm...'
          sleep 3
        done
    networks:
      - a2a-auth-network

  mock-agent-oidc:
    image: ghcr.io/inference-gateway/mock-agent:0.5.0
    pull_policy: always
    network_mode: service:keycloak
    environment:
      A2A_AGENT_URL: http://localhost:8092
      A2A_AUTH_ENABLED: true
      A2A_AUTH_ISSUER_URL: http://localhost:8090/realms/a2a
      A2A_AUTH_CLIENT_ID: mock-agent
      A2A_AUTH_AUDIENCE: mock-agent
    depends_on:
      keycloak-ready:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  a2a-auth-network:
    driver: bridge
