apiVersion: core.inference-gateway.com/v1alpha1
kind: Gateway
metadata:
  name: inference-gateway
  namespace: infer
spec:
  environment: development
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  providers:
    - name: OpenAI
      env:
        - name: OPENAI_API_KEY
          value: mock
        - name: OPENAI_API_URL
          value: http://mock-gateway:8080/v1
  telemetry:
    enabled: true
    traces:
      exporter:
        otlp:
          endpoint: http://otel-collector:4318
          protocol: http/protobuf
