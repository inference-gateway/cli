apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-scenarios
  namespace: infer
data:
  scenarios.yaml: |
    fallback:
      content: "Done."
    scenarios:
      - name: a2a
        match: '(?i)ask the (mock )?agent'
        turns:
          - tool_calls:
              - name: A2A_SubmitTask
                args:
                  agent_url: "http://mock-agent:8080"
                  task_description: "simulate 3 tool calls"
          - content: "The mock agent replied."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-gateway
  namespace: infer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-gateway
  template:
    metadata:
      labels:
        app: mock-gateway
    spec:
      containers:
        - name: mock-gateway
          image: alpine:3.24.3
          workingDir: /opt/tokenless
          command:
            - sh
            - -c
            - |
              BINARY=tokenless-linux-$(uname -m | sed -e 's/aarch64/arm64/' -e 's/x86_64/amd64/')
              RELEASE=https://github.com/inference-gateway/tokenless/releases/download/v0.11.0
              wget -q "$RELEASE/$BINARY" "$RELEASE/checksums.txt"
              grep " $BINARY\$" checksums.txt | sha256sum -c -
              chmod +x "$BINARY"
              exec "./$BINARY" --host 0.0.0.0 --port 8080 --model gpt-4o \
                --scenarios /etc/mock/scenarios.yaml
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 3
            failureThreshold: 60
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: scenarios
              mountPath: /etc/mock
            - name: bin
              mountPath: /opt/tokenless
      volumes:
        - name: scenarios
          configMap:
            name: mock-scenarios
        - name: bin
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mock-gateway
  namespace: infer
spec:
  selector:
    app: mock-gateway
  ports:
    - port: 8080
      targetPort: 8080
