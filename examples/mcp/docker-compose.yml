services:
  inference-gateway:
    image: ghcr.io/inference-gateway/inference-gateway:latest
    pull_policy: always
    container_name: inference-gateway
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY}
      COHERE_API_KEY: ${COHERE_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OLLAMA_CLOUD_API_KEY: ${OLLAMA_CLOUD_API_KEY}
      GOOGLE_API_KEY: ${OLLAMA_CLOUD_API_KEY}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
    restart: unless-stopped
    networks:
      - mcp-demo

  mcp-demo-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: mcp-demo-server
    environment:
      DEMO_MESSAGE: Hello from MCP Demo Server!
      ENVIRONMENT: development
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - 'curl -fsS -X POST http://localhost:3000/mcp -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" -H "MCP-Protocol-Version: 2026-07-28" -H "Mcp-Method: server/discover" -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"server/discover\",\"params\":{\"_meta\":{\"io.modelcontextprotocol/protocolVersion\":\"2026-07-28\",\"io.modelcontextprotocol/clientCapabilities\":{}}}}" > /dev/null || exit 1'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mcp-demo

  cli:
    profiles:
      - cli
    image: ghcr.io/inference-gateway/cli:latest
    environment:
      INFER_MCP_ENABLED: true
      INFER_MCP_CONNECTION_TIMEOUT: "30"
      INFER_MCP_DISCOVERY_TIMEOUT: "30"
    volumes:
      - ./mcp-config.yaml:/home/infer/.infer/mcp.yaml:ro
      - infer-data:/home/infer/.infer/data
    command:
      - chat
    depends_on:
      inference-gateway:
        condition: service_started
      mcp-demo-server:
        condition: service_healthy
    networks:
      - mcp-demo

networks:
  mcp-demo:
    driver: bridge

volumes:
  infer-data:
