fallback:
  content: 'Try "research the repository with two subagents", "research the README with the researcher agent", "write a note to explore-notes.txt" or "run a team of two teammates, one messages you".'
scenarios:
  - name: fanout
    match: '(?i)^research the repository with two subagents'
    turns:
      - tool_calls:
          - name: Agent
            args:
              tasks:
                - label: readme-summary
                  agent: researcher
                  description: Read the repository README and summarize its Quick Start in one sentence
                - label: docs-counter
                  description: Count the Markdown files under docs/ and report what kind of guides they are
      - content: Both subagents are done. Their answers are in the Agent tool result above - the named researcher agent and the plain one reported back from their own sessions.
      - content: Both subagents are done. Their answers are in the Agent tool result above - the named researcher agent and the plain one reported back from their own sessions.
  - name: named-agent
    match: '(?i)^research the README with the researcher agent'
    turns:
      - tool_calls:
          - name: Agent
            args:
              agent: researcher
              description: Read the repository README and summarize its Quick Start in one sentence
              label: readme-summary
      - content: The researcher agent reported back through its Markdown preset - allowlist Read plus Grep, derived read-only capability, inherited model.
      - content: The researcher agent reported back through its Markdown preset - allowlist Read plus Grep, derived read-only capability, inherited model.
  - name: researcher-task
    match: '(?i)^Read the repository README and summarize its Quick Start in one sentence'
    turns:
      - content: 'Researcher: the Quick Start is three commands that install infer, set the gateway URL and open the chat TUI.'
      - content: 'Researcher: the Quick Start is three commands that install infer, set the gateway URL and open the chat TUI.'
  - name: counter-task
    match: '(?i)^Count the Markdown files under docs/ and report what kind of guides they are'
    turns:
      - content: 'Counter: docs/ holds the reference guides of this repository, one document per feature.'
      - content: 'Counter: docs/ holds the reference guides of this repository, one document per feature.'
  - name: team
    match: '(?i)^run a team of two teammates, one of them messages you'
    turns:
      - tool_calls:
          - name: Agent
            args:
              tasks:
                - label: alpha
                  description: Scan docs/ for the guide that covers subagents and hold your finding for your lead
                - label: beta
                  description: Scan README.md and message your lead what the Quick Start covers
      - content: The team reported back - the fan-in carries alpha's docs answer and beta's README answer, and beta's mid-run message reached me as a note from a teammate.
      - content: The team reported back - the fan-in carries alpha's docs answer and beta's README answer, and beta's mid-run message reached me as a note from a teammate.
  - name: alpha-task
    match: '(?i)^Scan docs/ for the guide that covers subagents and hold your finding for your lead'
    turns:
      - content: 'Alpha: docs/subagents.md is the guide that covers subagents - Markdown presets, built-ins and teams.'
      - content: 'Alpha: docs/subagents.md is the guide that covers subagents - Markdown presets, built-ins and teams.'
  - name: beta-task
    match: '(?i)^Scan README.md and message your lead what the Quick Start covers'
    turns:
      - tool_calls:
          - name: Agent
            args:
              to: lead
              message: 'Beta: the README Quick Start covers three commands - install infer, set the gateway URL and open the chat TUI.'
      - content: 'Beta: the README Quick Start summary went to the lead. A reply arrives as a note from the lead.'
      - content: 'Beta: the README Quick Start summary went to the lead. A reply arrives as a note from the lead.'
  - name: explore-write
    match: '(?i)^write a note to explore-notes.txt'
    turns:
      - tool_calls:
          - name: Write
            args:
              file_path: /tmp/explore-notes.txt
              content: 'Notes from the explore agent - this call should be refused while the chat runs as explore.'
      - content: 'The Write call was refused - the read-only agent answered your message and may call Read, Grep, Tree, WebFetch and WebSearch only.'
      - content: 'The Write call was refused - the read-only agent answered your message and may call Read, Grep, Tree, WebFetch and WebSearch only.'
  - name: lead-note
    match: '\[Message from beta\]'
    turns:
      - content: 'Note read - the message from beta says the README Quick Start covers three commands: install infer, set the gateway URL and open the chat TUI.'
      - content: 'Note read - the message from beta says the README Quick Start covers three commands: install infer, set the gateway URL and open the chat TUI.'
