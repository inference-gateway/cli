version: '3'

vars:
  CLUSTER: infer-headscale
  KUBECTL: kubectl --context k3d-infer-headscale
  NAMESPACE: infer-peers
  CERT_MANAGER_VERSION: v1.21.3
  INFERENCE_GATEWAY_OPERATOR_VERSION: v0.31.0
  HEADSCALE: kubectl --context k3d-infer-headscale -n headscale exec deploy/headscale -- headscale
  NODES: infer-local infer-k8s gateway attacker
  STATE_DIR: '{{.TASKFILE_DIR}}/.state'
  PROJECT: /home/infer/src/project
  LOCAL: docker exec infer-local

tasks:
  up:
    desc: Run every setup step in order, from an empty machine to infer-local, infer-k8s and the mock gateway on one Headscale tailnet
    cmds:
      - task: cluster:create
      - task: image:import
      - task: certs:install
      - task: secrets
      - task: headscale:install
      - task: headscale:keys
      - task: deploy
      - task: local:up

  cluster:create:
    desc: Create the k3d cluster with ctlptl, one server and two agents, and the infer-peers namespace
    cmds:
      - ctlptl apply -f Cluster.yaml
      - '{{.KUBECTL}} apply -f k8s/namespace.yaml'

  image:import:
    desc: Build the infer image from this checkout and import it into the cluster
    cmds:
      - task -d {{.TASKFILE_DIR}}/../.. container:build
      - k3d image import ghcr.io/inference-gateway/cli:local -c {{.CLUSTER}}

  certs:install:
    desc: Install cert-manager, which issues every certificate from one demo CA
    cmds:
      - '{{.KUBECTL}} apply -f https://github.com/cert-manager/cert-manager/releases/download/{{.CERT_MANAGER_VERSION}}/cert-manager.yaml'
      - '{{.KUBECTL}} -n cert-manager wait --for=condition=Available deployment --all --timeout=300s'

  secrets:
    desc: Issue the infer-k8s, gateway and infer-local certificates, publish the demo CA for the tailscale clients, and create the forwarded demo secret
    cmds:
      - '{{.KUBECTL}} apply -f k8s/certificates.yaml'
      - '{{.KUBECTL}} -n {{.NAMESPACE}} wait --for=condition=Ready certificate --all --timeout=180s'
      - |
        {{.KUBECTL}} -n {{.NAMESPACE}} get secret infer-k8s-tls -o jsonpath='{.data.ca\.crt}' | base64 -d \
          | {{.KUBECTL}} -n {{.NAMESPACE}} create configmap tailnet-ca --from-file=ca.crt=/dev/stdin --dry-run=client -o yaml \
          | {{.KUBECTL}} apply -f -
      - |
        {{.KUBECTL}} -n {{.NAMESPACE}} get secret demo-secret >/dev/null 2>&1 || \
          {{.KUBECTL}} -n {{.NAMESPACE}} create secret generic demo-secret --from-literal=DEMO_SECRET="sealed-$(openssl rand -hex 16)"

  headscale:install:
    desc: Deploy Headscale, the self-hosted control server, with its embedded DERP relay and STUN, its DNS and its policy
    cmds:
      - '{{.KUBECTL}} apply -f headscale/server.yaml'
      - |
        {{.KUBECTL}} -n headscale create configmap headscale \
          --from-file=config.yaml=headscale/config.yaml --from-file=policy.hujson=headscale/policy.hujson \
          --dry-run=client -o yaml | {{.KUBECTL}} apply -f -
      - '{{.KUBECTL}} -n headscale wait --for=condition=Ready certificate/headscale-tls --timeout=180s'
      - '{{.KUBECTL}} -n headscale rollout status deployment/headscale --timeout=300s'

  headscale:keys:
    desc: Create one tagged, ephemeral, reusable pre-auth key per node and keep each in a Secret, so a recreated pod joins again
    cmds:
      - '{{.HEADSCALE}} users list -o json | jq -e ''any(.[]?; .name == "infer")'' >/dev/null || {{.HEADSCALE}} users create infer >/dev/null'
      - |
        USER_ID=$({{.HEADSCALE}} users list -o json | jq -r '.[] | select(.name == "infer") | .id')
        for node in {{.NODES}}; do
          {{.KUBECTL}} -n {{.NAMESPACE}} get secret tailnet-key-$node >/dev/null 2>&1 && continue
          {{.HEADSCALE}} preauthkeys create --user "$USER_ID" --tags tag:$node --ephemeral --reusable --expiration 720h -o json \
            | jq -j .key \
            | {{.KUBECTL}} -n {{.NAMESPACE}} create secret generic tailnet-key-$node --from-file=authkey=/dev/stdin >/dev/null
          echo "pre-auth key for $node: tag:$node, ephemeral, reusable"
        done

  deploy:
    desc: Start the mock gateway (tokenless) and its tailnet proxy, the infer-k8s daemon and the attacker node
    cmds:
      - task: model
        vars:
          MODEL: openai/gpt-4o
      - '{{.KUBECTL}} apply -f k8s/gateway.yaml -f k8s/gateway-tailnet.yaml -f k8s/infer-k8s.yaml -f k8s/attacker.yaml'
      - '{{.KUBECTL}} -n {{.NAMESPACE}} rollout status deployment/gateway-mock deployment/gateway-tailnet --timeout=300s'
      - '{{.KUBECTL}} -n {{.NAMESPACE}} wait --for=condition=Ready pod/infer-k8s pod/attacker --timeout=300s'

  model:
    internal: true
    cmds:
      - |
        {{.KUBECTL}} -n {{.NAMESPACE}} create configmap infer-k8s-model --from-literal=model={{.MODEL}} \
          --dry-run=client -o yaml | {{.KUBECTL}} apply -f -

  operator:install:
    desc: Install the Inference Gateway operator, which runs the real gateway from a Gateway resource
    cmds:
      - '{{.KUBECTL}} apply -f https://github.com/inference-gateway/operator/releases/download/{{.INFERENCE_GATEWAY_OPERATOR_VERSION}}/install.yaml'
      - '{{.KUBECTL}} -n inference-gateway-system wait --for=condition=Available deployment --all --timeout=180s'

  gateway:real:
    desc: Replace the mock with the Inference Gateway and a real provider - needs <PROVIDER>_API_KEY in your environment
    vars:
      PROVIDER: '{{default "openai" .PROVIDER}}'
      MODEL: '{{default "openai/gpt-4o-mini" .MODEL}}'
      KEY_ENV: '{{upper .PROVIDER}}_API_KEY'
    preconditions:
      - sh: printenv {{.KEY_ENV}} >/dev/null
        msg: 'Set {{.KEY_ENV}} first, for example {{.KEY_ENV}}=... task gateway:real PROVIDER={{.PROVIDER}} MODEL={{.MODEL}}'
    cmds:
      - task: operator:install
      - |
        printenv {{.KEY_ENV}} | tr -d '\n' \
          | {{.KUBECTL}} -n {{.NAMESPACE}} create secret generic gateway-provider --from-file=api-key=/dev/stdin --dry-run=client -o yaml \
          | {{.KUBECTL}} apply -f -
      - '{{.KUBECTL}} -n {{.NAMESPACE}} get deployment gateway-mock >/dev/null 2>&1 && {{.KUBECTL}} -n {{.NAMESPACE}} delete deployment/gateway-mock service/gateway --wait || true'
      - until [ -z "$({{.KUBECTL}} -n {{.NAMESPACE}} get pod -l gateway=tokenless -o name)" ]; do sleep 2; done
      - |
        sed -e "s|PROVIDER_NAME|{{.PROVIDER}}|" -e "s|PROVIDER_KEY_ENV|{{.KEY_ENV}}|" k8s/gateway-real.yaml \
          | {{.KUBECTL}} apply -f -
      - until {{.KUBECTL}} -n {{.NAMESPACE}} get deployment gateway >/dev/null 2>&1; do sleep 2; done
      - '{{.KUBECTL}} -n {{.NAMESPACE}} rollout status deployment/gateway --timeout=300s'
      - task: model
        vars:
          MODEL: '{{.MODEL}}'
      - '{{.KUBECTL}} -n {{.NAMESPACE}} delete pod infer-k8s --wait'
      - task: headscale:forget-offline
      - '{{.KUBECTL}} apply -f k8s/infer-k8s.yaml'
      - '{{.KUBECTL}} -n {{.NAMESPACE}} wait --for=condition=Ready pod/infer-k8s --timeout=300s'
      - echo "infer-k8s now asks {{.MODEL}} through the Inference Gateway"

  headscale:forget-offline:
    internal: true
    cmds:
      - |
        for id in $({{.HEADSCALE}} nodes list -o json | jq -r '.[] | select(.online != true) | .id'); do
          {{.HEADSCALE}} nodes delete --identifier "$id" --force >/dev/null
        done

  local:up:
    desc: Start infer-local, the daemon on "your machine" - a Docker container beside the cluster with its own tailscale client
    cmds:
      - |
        secret() { {{.KUBECTL}} -n {{.NAMESPACE}} get secret "$1" -o json | jq -r --arg key "$2" '.data[$key]' | base64 -d; }
        mkdir -p {{.STATE_DIR}}/infer-local-tls
        for file in ca.crt tls.crt tls.key; do secret infer-local-tls $file > {{.STATE_DIR}}/infer-local-tls/$file; done
        export TS_AUTHKEY=$(secret tailnet-key-infer-local authkey)
        export DEMO_SECRET=$(secret demo-secret DEMO_SECRET)
        export HEADSCALE_NODE_IP=$(docker inspect k3d-{{.CLUSTER}}-server-0 | jq -r '.[0].NetworkSettings.Networks["k3d-{{.CLUSTER}}"].IPAddress')
        docker compose -f local/compose.yaml up -d --wait
      - |
        for attempt in $(seq 60); do
          {{.LOCAL}} nslookup infer-k8s.tailnet.internal >/dev/null 2>&1 && exit 0
          sleep 2
        done
        echo "infer-local cannot resolve infer-k8s.tailnet.internal, see docker logs infer-local-tailscale" >&2
        exit 1
      - |
        {{.LOCAL}} sh -c '
          mkdir -p {{.PROJECT}} && cd {{.PROJECT}} && [ -d .git ] && exit 0
          git init --quiet -b main
          git config user.email demo@example.com
          git config user.name demo
          git config commit.gpgsign false
          echo "# teleport me" > README.md
          git add README.md
          git commit --quiet -m init'

  local:down:
    desc: Stop and remove infer-local and its tailscale client
    cmds:
      - docker compose -f local/compose.yaml down --volumes

  workspaces:
    desc: List the workspaces infer-local can teleport to and their reachability
    cmds:
      - '{{.LOCAL}} infer daemon workspaces'

  sniff:start:
    desc: Start a packet capture in front of the infer-k8s node, then send it a plaintext canary from infer-local so the capture proves it reads plaintext
    cmds:
      - '{{.KUBECTL}} -n {{.NAMESPACE}} delete pod sniffer --ignore-not-found --wait'
      - '{{.KUBECTL}} apply -f k8s/sniffer.yaml'
      - '{{.KUBECTL}} -n {{.NAMESPACE}} wait --for=condition=Ready pod/sniffer --timeout=180s'
      - sleep 2
      - |
        CANARY="plaintext-canary-$(openssl rand -hex 4)"
        printf '%s' "$CANARY" > {{.STATE_DIR}}/canary
        NODE_IP=$(docker inspect k3d-{{.CLUSTER}}-agent-1 | jq -r '.[0].NetworkSettings.Networks["k3d-{{.CLUSTER}}"].IPAddress')
        {{.LOCAL}} wget -q -O /dev/null --header "X-Canary: $CANARY" http://$NODE_IP:9090/metrics

  demo:
    desc: Create a conversation on infer-local, teleport it to infer-k8s over the tailnet and continue it there through the gateway
    vars:
      PROMPT: '{{default "say hello again" .PROMPT}}'
      ID:
        sh: uuidgen | tr 'A-Z' 'a-z'
    cmds:
      - mkdir -p {{.STATE_DIR}}
      - printf '%s' {{.ID}} > {{.STATE_DIR}}/session
      - '{{.LOCAL}} sh -c "cd {{.PROJECT}} && infer headless --session-id {{.ID}} \"say hello\""'
      - '{{.LOCAL}} infer daemon workspaces'
      - '{{.LOCAL}} infer daemon teleport {{.ID}} --to infer-k8s --project-dir {{.PROJECT}}'
      - '{{.LOCAL}} infer daemon run {{.ID}} "{{.PROMPT}}" --project-dir {{.PROJECT}}'
      - echo "conversation {{.ID}} now lives on infer-k8s"

  secret:check:
    desc: Show that DEMO_SECRET reached the session's worker on infer-k8s, and no Kubernetes object there
    cmds:
      - |
        echo "infer-local DEMO_SECRET sha256: $({{.KUBECTL}} -n {{.NAMESPACE}} get secret demo-secret -o jsonpath='{.data.DEMO_SECRET}' | base64 -d | sha256sum | cut -c1-16)"
      - |
        {{.KUBECTL}} -n {{.NAMESPACE}} exec infer-k8s -c daemon -- sh -c '
          for pid in $(pgrep -f "infer headless --serve"); do
            value=$(tr "\0" "\n" < /proc/$pid/environ 2>/dev/null | sed -n "s/^DEMO_SECRET=//p")
            [ -n "$value" ] && echo "infer-k8s worker $pid sha256:   $(printf %s "$value" | sha256sum | cut -c1-16)"
          done
          true'
      - |
        echo "DEMO_SECRET in the infer-k8s pod spec: $({{.KUBECTL}} -n {{.NAMESPACE}} get pod infer-k8s -o yaml | grep -c DEMO_SECRET || true)"

  sniff:report:
    desc: Read the capture back - no binding or gateway traffic in clear, no token, no secret, no model reply, but the plaintext canary
    cmds:
      - '{{.KUBECTL}} -n {{.NAMESPACE}} exec sniffer -- cat /captures/teleport.pcap > {{.STATE_DIR}}/teleport.pcap'
      - |
        count() { {{.KUBECTL}} -n {{.NAMESPACE}} exec sniffer -- sh -c "tcpdump -nn -r /captures/teleport.pcap '$1' 2>/dev/null | wc -l"; }
        matches() { grep -c -a -F "$1" {{.STATE_DIR}}/teleport.pcap || true; }
        SECRET=$({{.KUBECTL}} -n {{.NAMESPACE}} get secret demo-secret -o jsonpath='{.data.DEMO_SECRET}' | base64 -d)
        echo "WireGuard packets (udp port 41641):  $(count 'udp port 41641')"
        echo "binding packets (tcp port 52789):    $(count 'tcp port 52789')"
        echo "gateway packets (tcp port 8443):     $(count 'tcp port 8443')"
        echo "DEMO_SECRET in the capture:          $(matches "$SECRET")"
        echo "the gateway's reply in the capture:  $(matches 'Hello from tokenless')"
        echo "plaintext canary in the capture:     $(matches "$(cat {{.STATE_DIR}}/canary)")"
        echo "capture saved to {{.STATE_DIR}}/teleport.pcap"

  attack:
    desc: Try infer-k8s and the gateway from the attacker, a tailnet node no policy admits, then each hop from the node its policy admits, without the client certificate
    cmds:
      - |
        tailnet_ip() { {{.HEADSCALE}} nodes list -o json | jq -r --arg name "$1" '.[] | select(.given_name == $name and .online == true) | .ip_addresses[0]'; }
        pod_ip() { {{.KUBECTL}} -n {{.NAMESPACE}} get pod -l "app=$1" -o jsonpath='{.items[0].status.podIP}'; }
        attacker() { echo "== attacker: $1"; {{.KUBECTL}} -n {{.NAMESPACE}} exec attacker -c attacker -- sh -c "$1 2>&1 || true"; }
        attacker "nslookup infer-k8s.tailnet.internal | tail -n 2"
        attacker "nc -z -v -w 3 $(tailnet_ip infer-k8s) 52789"
        attacker "nc -z -v -w 3 $(pod_ip infer-k8s) 52789"
        attacker "nslookup gateway.tailnet.internal | tail -n 2"
        attacker "nc -z -v -w 3 $(tailnet_ip gateway) 8443"
        attacker "nc -z -v -w 3 $(pod_ip gateway) 8443"
        echo "== attacker: its tailnet peers"
        {{.KUBECTL}} -n {{.NAMESPACE}} exec attacker -c tailscale -- tailscale status
        echo "== infer-local: the gateway, two hops away"
        {{.LOCAL}} sh -c "nc -z -w 3 gateway.tailnet.internal 8443 2>&1 || echo 'gateway.tailnet.internal: unreachable from infer-local'"
        echo "== infer-local's network, the policy admits it, but no client certificate"
        docker run --rm -q --network container:infer-local-tailscale -v {{.STATE_DIR}}/infer-local-tls/ca.crt:/ca.crt:ro nicolaka/netshoot:v0.15 \
          sh -c 'curl -sS --max-time 5 --cacert /ca.crt https://infer-k8s.tailnet.internal:52789/ws 2>&1 || true'
        echo "== infer on infer-k8s, the policy admits it, but without its client certificate"
        {{.KUBECTL}} -n {{.NAMESPACE}} exec infer-k8s -c daemon -- \
          env -u INFER_GATEWAY_TLS_CERT_FILE -u INFER_GATEWAY_TLS_KEY_FILE infer status 2>&1 | grep "Gateway Status" || true

  tailnet:status:
    desc: Show the tailnet from Headscale and from infer-k8s - every node, its tags, and how infer-k8s reaches each neighbour (direct or relayed)
    cmds:
      - |
        echo "== Headscale: every node"
        {{.HEADSCALE}} nodes list -o json | jq -r '
          ["NAME", "TAGS", "ADDRESS", "STATE"],
          (.[] | [.given_name, (.tags | join(",")), .ip_addresses[0], (if .online then "online" else "offline" end)])
          | @tsv' | column -t
      - |
        echo "== infer-k8s: the peers the policy lets it see, and how it reaches them"
        {{.KUBECTL}} -n {{.NAMESPACE}} exec infer-k8s -c tailscale -- tailscale status

  teleport:back:
    desc: Bring the session of the last demo (or ID) back to infer-local
    vars:
      ID:
        sh: echo '{{.ID}}' | grep . || cat {{.STATE_DIR}}/session 2>/dev/null || true
    preconditions:
      - sh: test -n "{{.ID}}"
        msg: No session to bring back. Run task demo first, or pass ID=<conversation id>
    cmds:
      - '{{.LOCAL}} infer daemon teleport {{.ID}} --to infer-local --project-dir {{.PROJECT}}'
      - '{{.LOCAL}} infer daemon run {{.ID}} "and back home" --project-dir {{.PROJECT}}'

  cleanup:
    desc: Remove infer-local, delete the cluster and the local state (certificates, session, capture)
    cmds:
      - task: local:down
      - ctlptl delete -f Cluster.yaml
      - rm -rf {{.STATE_DIR}}
