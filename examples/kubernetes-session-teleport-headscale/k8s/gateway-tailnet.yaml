apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-tailnet-wireguard-only
  namespace: infer-peers
spec:
  podSelector:
    matchLabels:
      app: gateway-tailnet
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: UDP
          port: 41641
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-tailnet-serve
  namespace: infer-peers
data:
  serve.json: |
    {
      "TCP": {
        "8443": {
          "TCPForward": "gateway.infer-peers.svc.cluster.local:8443"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-tailnet
  namespace: infer-peers
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway-tailnet
  template:
    metadata:
      labels:
        app: gateway-tailnet
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3d-infer-headscale-agent-0
      containers:
        - name: tailscale
          image: tailscale/tailscale:v1.104.4
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailnet-key-gateway
                  key: authkey
            - name: TS_HOSTNAME
              value: gateway
            - name: TS_EXTRA_ARGS
              value: --login-server=https://headscale.headscale.svc.cluster.local:9443
            - name: TS_TAILSCALED_EXTRA_ARGS
              value: --port=41641
            - name: TS_USERSPACE
              value: "true"
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_SERVE_CONFIG
              value: /etc/tailscale-serve/serve.json
            - name: SSL_CERT_FILE
              value: /etc/tailnet-ca/ca.crt
          volumeMounts:
            - name: serve
              mountPath: /etc/tailscale-serve
              readOnly: true
            - name: tailnet-ca
              mountPath: /etc/tailnet-ca
              readOnly: true
      volumes:
        - name: serve
          configMap:
            name: gateway-tailnet-serve
        - name: tailnet-ca
          configMap:
            name: tailnet-ca
