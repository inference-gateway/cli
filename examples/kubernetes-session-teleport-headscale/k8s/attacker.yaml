apiVersion: v1
kind: Pod
metadata:
  name: attacker
  namespace: infer-peers
  labels:
    app: attacker
spec:
  nodeSelector:
    kubernetes.io/hostname: k3d-infer-headscale-agent-0
  containers:
    - name: attacker
      image: nicolaka/netshoot:v0.15
      command:
        - sleep
        - infinity
    - name: tailscale
      image: tailscale/tailscale:v1.104.4
      env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tailnet-key-attacker
              key: authkey
        - name: TS_HOSTNAME
          value: attacker
        - name: TS_EXTRA_ARGS
          value: --login-server=https://headscale.headscale.svc.cluster.local:9443
        - name: TS_TAILSCALED_EXTRA_ARGS
          value: --port=41641
        - name: TS_USERSPACE
          value: "false"
        - name: TS_ACCEPT_DNS
          value: "true"
        - name: TS_KUBE_SECRET
          value: ""
        - name: SSL_CERT_FILE
          value: /etc/tailnet-ca/ca.crt
      securityContext:
        privileged: true
      volumeMounts:
        - name: tailnet-ca
          mountPath: /etc/tailnet-ca
          readOnly: true
  volumes:
    - name: tailnet-ca
      configMap:
        name: tailnet-ca
