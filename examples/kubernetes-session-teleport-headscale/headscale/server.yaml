apiVersion: v1
kind: Namespace
metadata:
  name: headscale
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: headscale-tls
  namespace: headscale
spec:
  commonName: headscale.headscale.svc.cluster.local
  secretName: headscale-tls
  duration: 720h
  dnsNames:
    - headscale.headscale.svc.cluster.local
  usages:
    - server auth
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: peers-ca
    kind: ClusterIssuer
---
apiVersion: v1
kind: Service
metadata:
  name: headscale
  namespace: headscale
spec:
  type: LoadBalancer
  selector:
    app: headscale
  ports:
    - name: https
      protocol: TCP
      port: 9443
      targetPort: 9443
    - name: stun
      protocol: UDP
      port: 3478
      targetPort: 3478
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale
  namespace: headscale
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: headscale
  template:
    metadata:
      labels:
        app: headscale
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3d-infer-headscale-server-0
      containers:
        - name: headscale
          image: headscale/headscale:0.29.7
          args:
            - serve
          ports:
            - name: https
              containerPort: 9443
            - name: stun
              containerPort: 3478
              protocol: UDP
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
            periodSeconds: 3
          volumeMounts:
            - name: config
              mountPath: /etc/headscale/config.yaml
              subPath: config.yaml
            - name: config
              mountPath: /etc/headscale/policy.hujson
              subPath: policy.hujson
            - name: tls
              mountPath: /etc/headscale/tls
              readOnly: true
            - name: data
              mountPath: /var/lib/headscale
            - name: run
              mountPath: /var/run/headscale
      volumes:
        - name: config
          configMap:
            name: headscale
        - name: tls
          secret:
            secretName: headscale-tls
        - name: data
          emptyDir: {}
        - name: run
          emptyDir: {}
