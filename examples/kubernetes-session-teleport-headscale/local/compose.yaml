name: infer-local
services:
  tailscale:
    image: tailscale/tailscale:v1.104.4
    container_name: infer-local-tailscale
    hostname: infer-local
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: infer-local
      TS_EXTRA_ARGS: --login-server=https://headscale.headscale.svc.cluster.local:9443
      TS_TAILSCALED_EXTRA_ARGS: --port=41641
      TS_USERSPACE: "false"
      TS_ACCEPT_DNS: "true"
      SSL_CERT_FILE: /etc/infer/tls/ca.crt
    volumes:
      - ../.state/infer-local-tls/ca.crt:/etc/infer/tls/ca.crt:ro
    extra_hosts:
      - headscale.headscale.svc.cluster.local:${HEADSCALE_NODE_IP:-127.0.0.1}
    networks:
      - k3d
  infer:
    image: ghcr.io/inference-gateway/cli:local
    container_name: infer-local
    network_mode: service:tailscale
    depends_on:
      - tailscale
    command:
      - daemon
    environment:
      INFER_GATEWAY_MOCK: "true"
      INFER_AGENT_MODEL: mock/openai/gpt-4o
      DEMO_SECRET: ${DEMO_SECRET:-}
    volumes:
      - ./daemon.yaml:/home/infer/.infer/daemon.yaml:ro
      - ../.state/infer-local-tls:/etc/infer/tls:ro
networks:
  k3d:
    name: k3d-infer-headscale
    external: true
