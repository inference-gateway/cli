---
# One A2A agent with Microsoft Entra ID as the identity provider. The IDs come from .env, see .env.example.
services:
  mock-agent:
    image: ghcr.io/inference-gateway/mock-agent:0.5.0
    pull_policy: always
    env_file:
      - .env
    ports:
      - "8093:8080"
    environment:
      A2A_AGENT_URL: http://localhost:8093
      A2A_AUTH_ENABLED: true
      A2A_AUTH_ISSUER_URL: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
      A2A_AUTH_CLIENT_ID: ${AZURE_CLIENT_APP_ID}
      A2A_AUTH_AUDIENCE: ${AZURE_API_APP_ID}
    restart: unless-stopped
