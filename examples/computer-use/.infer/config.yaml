# Minimal config: everything not set here falls back to built-in defaults.
# docker-compose.yml already supplies gateway URL, model and web host/port as
# INFER_* env vars, so the only thing that has to live in a file is the SSH
# server list - a list of structs has no env-var equivalent.
web:
  servers:
    - name: "Ubuntu GUI Desktop"
      id: "ubuntu-gui-desktop"
      remote_host: "ubuntu-gui"
      remote_user: "ubuntu"
      remote_port: 22
      auto_install: true
      description: "Ubuntu 24.04 Desktop with Computer Use capabilities"
      tags:
        - local
        - computer-use
        - ubuntu
