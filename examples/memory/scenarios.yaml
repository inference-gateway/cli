fallback:
  content: 'Try "remember how to build this project" or "what does your memory say about building it".'
scenarios:
  - name: write-fact
    match: '(?i)remember how to build this project'
    turns:
      - tool_calls:
          - name: Memory
            args:
              operation: write
              name: demo-build-commands
              description: 'How to build and test the demo project'
              type: user
              content: 'Build with task build, then run task test. Lint with task lint and lint:imports.'
      - content: 'I saved that with the Memory tool (operation "write"). The fact is listed in the MEMORY.md index, so the next session starts knowing it.'
  - name: read-fact
    match: '(?i)what does your memory say about building'
    turns:
      - tool_calls:
          - name: Memory
            args:
              operation: read
              name: demo-build-commands
      - content: 'From your persistent memory: build with task build, then run task test. The Memory tool (operation "read") loaded the fact that a previous session wrote.'
  - name: forget-fact
    match: '(?i)forget the build-commands memory'
    turns:
      - tool_calls:
          - name: Memory
            args:
              operation: delete
              name: demo-build-commands
      - content: 'I deleted the fact with the Memory tool (operation "delete") - the fact-file and its MEMORY.md index entry are gone.'
  - name: hello
    match: '(?i)say hello'
    turns:
      - content: Hello from the mock model.
