schema-version = "1.17.0"

[vars]
GOPATH = "$HOME/go"
GOPROXY = "https://proxy.golang.org,direct"
GOSUMDB = "sum.golang.org"
GO111MODULE = "on"
NPM_CONFIG_PREFIX = "$FLOX_ENV_PROJECT/.flox/npm"
NODE_PATH = "$FLOX_ENV_PROJECT/.flox/npm/lib/node_modules"

[install]
go.pkg-path = "go"
go.version = "1.26.7"
go.pkg-group = "go"
nodejs.pkg-path = "nodejs_24"
nodejs.version = "^24.20.0"
git.pkg-path = "git"
git.version = "^2.55.0"
git.outputs = "all"
gh.pkg-path = "gh"
gh.version = "^2.101.0"
golangci-lint.pkg-path = "golangci-lint"
golangci-lint.version = "^2.13.2"
go-task.pkg-path = "go-task"
go-task.version = "^3.53.1"
ripgrep.pkg-path = "ripgrep"
ripgrep.version = "^15.2.0"
markdownlint-cli.pkg-path = "markdownlint-cli"
markdownlint-cli.version = "^0.49.1"
docker.pkg-path = "docker"
docker.version = "^29.8.0"
docker-compose.pkg-path = "docker-compose"
docker-compose.version = "^5.5.1"
gopls.pkg-path = "gopls"
gopls.version = "^0.23.0"
infer.flake = "github:inference-gateway/cli/v0.207.0"
claude-code.pkg-path = "claude-code"
claude-code.version = "^2.1.280"
claude-code.pkg-group = "claude-code"
codex.pkg-path = "codex"
codex.version = "^0.156.1"
codex.pkg-group = "codex"
k3d.pkg-path = "k3d"
k3d.version = "5.9.0"

[hook]
on-activate = '''
  export PATH="$HOME/go/bin:$PATH"
'''
