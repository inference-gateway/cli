schema-version = "1.19.0"

[vars]
GOPATH = "$HOME/go"
GOPROXY = "https://proxy.golang.org,direct"
GOSUMDB = "sum.golang.org"
GO111MODULE = "on"
NPM_CONFIG_PREFIX = "$FLOX_ENV_PROJECT/.flox/npm"
NODE_PATH = "$FLOX_ENV_PROJECT/.flox/npm/lib/node_modules"

[install]
go.pkg-path = "go"
go.version = "1.26.10"
go.pkg-group = "go"
nodejs.pkg-path = "nodejs_24"
nodejs.version = "^24.21.0"
git.pkg-path = "git"
git.version = "^2.56.0"
git.outputs = "all"
gh.pkg-path = "gh"
gh.version = "^2.103.3"
golangci-lint.pkg-path = "golangci-lint"
golangci-lint.version = "^2.15.0"
go-task.pkg-path = "go-task"
go-task.version = "^3.53.1"
ripgrep.pkg-path = "ripgrep"
ripgrep.version = "^15.2.0"
markdownlint-cli.pkg-path = "markdownlint-cli"
markdownlint-cli.version = "^0.50.0"
docker.pkg-path = "docker"
docker.version = "^29.9.2"
docker-compose.pkg-path = "docker-compose"
docker-compose.version = "^5.7.0"
gopls.pkg-path = "gopls"
gopls.version = "^0.24.0"
infer.flake = "github:inference-gateway/cli/v0.246.0"
claude-code.pkg-path = "claude-code"
claude-code.version = "^2.1.317"
claude-code.pkg-group = "claude-code"
codex.pkg-path = "codex"
codex.version = "^0.166.0"
codex.pkg-group = "codex"
k3d.pkg-path = "k3d"
k3d.version = "5.9.0"
kubectl.pkg-path = "kubectl"
kubernetes-helm.pkg-path = "kubernetes-helm"
ctlptl.pkg-path = "ctlptl"
ctlptl.version = "^0.9.6"

[hook]
on-activate = '''
  export PATH="$HOME/go/bin:$PATH"
'''
