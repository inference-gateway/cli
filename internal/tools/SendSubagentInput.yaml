name: SendSubagentInput
description: 'Send a follow-up message to a subagent you spawned, headless or interactive - to hand it new information, correct its course or ask a follow-up on its result without respawning it. ''text'' is the message. The subagent runs it as its next turn (queued if it is mid-turn) and you are AUTOMATICALLY NOTIFIED with a [Subagent Completed: ...] note when that turn finishes - do not poll. A headless subagent stays alive idle between turns until tools.agent.idle_timeout or CloseSubagent. ''keys'' (named keys: Enter, Escape, Up, Down, Left, Right, Tab, BSpace, Space, Home, End, PageUp, PageDown) and submit=false drive an interactive pane''s TUI and fail for a headless subagent. With submit=true (default) an interactive pane presses Enter to send the prompt. With submit=false it only sends the keys (TUI navigation/testing); observe the effect with ReadSubagentScreen. Pass the subagent_id from ListSubagents or the Agent result. To drive an interactive terminal program that is NOT a subagent, use the `tmux` skill (raw tmux via Bash) instead of this tool.'
parameters:
  type: object
  additionalProperties: false
  properties:
    keys:
      type: array
      description: 'Interactive subagents only. Named keys to send after the text. Allowed: Enter, Escape, Tab, Space, BSpace, Up, Down, Left, Right, Home, End, PageUp, PageDown'
      items:
        type: string
    subagent_id:
      type: string
      description: The subagent id from ListSubagents or the Agent result
    submit:
      type: boolean
      description: Interactive subagents only. Press Enter to submit a prompt and wait for the subagent to finish (default true). Set false to only send keys for TUI navigation - then inspect with ReadSubagentScreen.
    text:
      type: string
      description: The message to send (a follow-up prompt, new information, a correction). Typed literally into an interactive pane.
  required:
    - subagent_id
modes:
  - standard
  - auto
  - auto-with-judge
  - plan
