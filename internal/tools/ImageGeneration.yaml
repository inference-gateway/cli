name: ImageGeneration
description: |-
  Generate an image from a text prompt and save it as a PNG under ~/.infer/projects/<project-slug>/artifacts/. Returns the saved file path.

  The image is generated by the image model configured for this tool (not the chat model), so do not ask which model to use. Write the prompt yourself from the user's intent and the conversation context; it is sent to the image model verbatim.

  Cost control: quality defaults to "low" and size to "1024x1024". Keep those defaults unless the user explicitly asks for higher quality or a different size - higher tiers cost significantly more and take longer. "make it nicer" is not an explicit request for high quality; "high quality", "hd", "1536x1024" are.
parameters:
  type: object
  additionalProperties: false
  properties:
    prompt:
      type: string
      description: A text description of the desired image
    quality:
      type: string
      description: Image quality. Always use 'low' unless the user explicitly asks for higher quality - it is markedly cheaper and faster
      enum:
        - low
        - medium
        - high
      default: low
    size:
      type: string
      description: Image size. Always use '1024x1024' unless the user explicitly asks for a larger or differently shaped image
      enum:
        - 1024x1024
        - 1536x1024
        - 1024x1536
      default: 1024x1024
  required:
    - prompt
require_approval: false
