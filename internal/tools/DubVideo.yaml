name: DubVideo
description: |-
  Dub a video clip: the provider generates the sound that fits the clip and re-renders the clip with that sound as its new soundtrack, and the finished MP4 is saved. Returns the saved file path.

  video is a bare .mov, .mp4, .m4v or .webm file name, looked up in the working directory, then in the TextToVideo output directory, so a clip TextToVideo previously rendered can be passed directly by its file name - no directories, no absolute paths. Optionally describe the sound in prompt: the clip itself drives the result, prompt is only guidance on the sound to generate. Pass preserve_speech true to keep the clip's own dialogue under the generated sound. Mirelo lays only the generated mix onto the clip - the separated speech and sfx tracks are not available on a dubbed clip, so DubVideo offers no track parameter. Pass output_path to name the file: a bare file name only (no directories, no absolute paths) - the MP4 is ALWAYS written into the configured output directory, never the working directory or any path you choose; omit it for a timestamped name. The clip is uploaded to a third-party provider and must stay under 10 MiB. Dubbing can take minutes - do not poll between retries. Do not claim the clip was played - it is written to disk for the user to open, at the returned path.
parameters:
  type: object
  additionalProperties: false
  properties:
    output_path:
      type: string
      description: Optional bare file name (no directories or absolute paths) for the dubbed MP4; it is always placed in the configured output directory. Defaults to a timestamped file
    preserve_speech:
      type: boolean
      description: 'Optional: true to keep the clip''s own dialogue under the generated sound'
    prompt:
      type: string
      description: Description of the sound to generate (e.g. a busy cafe hubbub, a tense orchestral underscore) - the clip itself drives the result, the prompt is only guidance
    video:
      type: string
      description: Bare file name (no directories or absolute paths) of the .mov, .mp4, .m4v or .webm clip to dub, looked up in the working directory, then in the TextToVideo output directory
  required:
    - video
require_approval: false
