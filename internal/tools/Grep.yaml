name: Grep
description: |
  A powerful search tool with configurable backend (ripgrep or Go implementation)

   Usage:
   - ALWAYS use Grep for search tasks. NEVER invoke `grep` or `rg` as a Bash command. The Grep tool has been optimized for correct permissions and access.
   - Regex syntax is RE2 (e.g., "log.*Error", "function\s+\w+") - no lookahead, lookbehind or backreferences
   - Filter files with glob parameter (e.g., "*.js", "**/*.tsx") or type parameter (e.g., "js", "py", "rust")
   - Output modes: "content" shows matching lines, "files_with_matches" shows only file paths (default), "count" shows match counts
   - Use the Agent tool for open-ended searches requiring multiple rounds
   - Pattern syntax: When using ripgrep backend - literal braces need escaping (use `interface\{\}` to find `any` in Go code)
   - Multiline matching: By default patterns match within single lines only. For cross-line patterns like `struct \{[\s\S]*?field`, use `multiline: true`
parameters:
  $schema: http://json-schema.org/draft-07/schema#
  type: object
  properties:
    -A:
      type: number
      description: 'Number of lines to show after each match (rg -A). Requires output_mode: "content", ignored otherwise.'
    -B:
      type: number
      description: 'Number of lines to show before each match (rg -B). Requires output_mode: "content", ignored otherwise.'
    -C:
      type: number
      description: 'Number of lines to show before and after each match (rg -C). Requires output_mode: "content", ignored otherwise.'
    -i:
      type: boolean
      description: Case insensitive search (rg -i)
    -n:
      type: boolean
      description: 'Show line numbers in output (rg -n). Requires output_mode: "content", ignored otherwise.'
    glob:
      type: string
      description: Glob pattern to filter files (e.g. "*.js", "*.{ts,tsx}") - maps to rg --glob
    head_limit:
      type: number
      description: 'Limit output to first N lines/entries, equivalent to "| head -N". Works across all output modes: content (limits output lines), files_with_matches (limits file paths), count (limits count entries). When unspecified, shows all results from ripgrep.'
    multiline:
      type: boolean
      description: 'Enable multiline mode where . matches newlines and patterns can span lines (rg -U --multiline-dotall). Default: false.'
      default: false
    output_mode:
      type: string
      description: 'Output mode: "content" shows matching lines (supports -A/-B/-C context, -n line numbers), "files_with_matches" shows file paths (supports head_limit), "count" shows match counts (supports head_limit). Defaults to "files_with_matches".'
      enum:
        - content
        - files_with_matches
        - count
      default: files_with_matches
    path:
      type: string
      description: File or directory to search in (rg PATH). Defaults to current working directory.
    pattern:
      type: string
      description: The regular expression pattern to search for in file contents
    type:
      type: string
      description: 'File type to search (rg --type). Common types: js, py, rust, go, java, etc. More efficient than include for standard file types.'
  required:
    - pattern
modes: [standard, auto, auto-with-judge, plan, readonly]
