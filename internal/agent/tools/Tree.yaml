name: Tree
description: Display directory structure in a tree format, similar to the Unix tree command. Use format "compact" for a token-efficient one-directory-per-line listing (root-first, git-tracked non-ignored files only) when you just need to see where files live.
parameters:
  type: object
  properties:
    format:
      type: string
      description: 'Output format: text (ASCII tree), json, or compact (one directory per line, root-first, git-tracked non-ignored files only)'
      enum:
        - text
        - json
        - compact
      default: text
    max_depth:
      type: integer
      description: Maximum depth to traverse (optional, defaults to 3 for efficiency)
      default: 3
      minimum: 1
      maximum: 10
    max_files:
      type: integer
      description: Maximum number of files to display (optional, defaults to 100 for efficiency)
      default: 100
      minimum: 1
      maximum: 1000
    path:
      type: string
      description: The path to display tree structure for (defaults to current directory)
      default: .
    respect_gitignore:
      type: boolean
      description: Whether to automatically exclude patterns from .gitignore (defaults to true)
      default: true
    show_hidden:
      type: boolean
      description: Whether to show hidden files and directories (defaults to false)
      default: false
  required: []
modes: [standard, auto, auto-with-judge, plan, readonly]
